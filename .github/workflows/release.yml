name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remink
        uses: actions/checkout@v4
        with:
          path: remink

      - name: Checkout MMD
        uses: actions/checkout@v4
        with:
          repository: mudita/MMD
          path: MMD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: remink
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK to release version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: remink/app/build/outputs/apk/debug
        run: mv app-debug.apk "remink-${GITHUB_REF_NAME#v}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: remink-apk
          path: remink/app/build/outputs/apk/debug/*.apk

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: remink/app/build/outputs/apk/debug/remink-*.apk
          generate_release_notes: true
